# Memory. The Kotlin daemon had 1024m, which is not enough to compile this
# module: Compose + Hilt/KSP + SQLDelight + POI in one compilation unit
# exhausts it and the JVM dies mid-task. Gradle reports that as
# "Connection to the Kotlin daemon has been unexpectedly lost", which reads
# like a crash or an environment problem rather than an out-of-memory, so it
# is worth naming here. MaxMetaspaceSize matters as much as the heap — KSP
# and the Compose compiler plugin load a lot of classes, and metaspace
# exhaustion kills the daemon the same way.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false
kotlin.incremental=true
ksp.incremental=true
ksp.incremental.intermodule=isolating
android.useAndroidX=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
ksp.useKSP2=false

# Increase network timeouts for dependency downloads (3 minutes)
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
